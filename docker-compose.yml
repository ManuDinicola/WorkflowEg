services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flowd
      POSTGRES_PASSWORD: flowd
      POSTGRES_DB: flowd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowd -d flowd"]
      interval: 2s
      timeout: 3s
      retries: 30

  flowd:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Flowd__ConnectionString: Host=postgres;Database=flowd;Username=flowd;Password=flowd
    command: ["serve", "--auto-migrate"]
    ports:
      - "8080:8080"
