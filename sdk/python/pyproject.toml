[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowd-client"
version = "0.1.0"
description = "Worker SDK for the Flowd workflow engine: typed client and long-polling job worker (standard library only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["flowd_client*"]
