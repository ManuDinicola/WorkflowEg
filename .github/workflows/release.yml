name: release

# Push a tag like v0.3.0 to build, test and publish a GitHub release with
# self-contained packages (Windows x64 for the Windows Server install, Linux x64 as a bonus).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_IMAGE_TAG: "17"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: make ci
        run: make ci

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.x versions and anything with a suffix (-rc.1) are pre-releases.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish self-contained packages
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for rid in win-x64 linux-x64; do
            dotnet publish src/Flowd.Host/Flowd.Host.csproj -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:Version="$version" -p:InformationalVersion="$version+${GITHUB_SHA::8}" \
              -o "publish/$rid" --nologo -v:q
            cp README.md LICENSE "publish/$rid/"
          done
          cp scripts/install-service.ps1 publish/win-x64/
          (cd publish/win-x64 && zip -qr "../../dist/flowd-$version-win-x64.zip" .)
          tar -C publish/linux-x64 -czf "dist/flowd-$version-linux-x64.tar.gz" .
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags="--generate-notes --verify-tag"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags="$flags --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Flowd ${{ steps.version.outputs.version }}" $flags

      - name: Upload packages as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: flowd-packages
          path: dist/
